<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frost Slide course viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #102030;
        font:
          13px system-ui,
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="info"></div>
    <script type="module" src="./src/dev/viewer.ts"></script>
  </body>
</html>

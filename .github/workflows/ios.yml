name: iOS build

# Compiles the Capacitor iOS app without signing, to catch native build breaks (plugin updates,
# Swift Package resolution, Xcode changes). Run it by hand from the Actions tab: macOS minutes
# cost more than Linux ones. Shipping still happens from a Mac with a signing team (see
# web/README.md).
on:
  workflow_dispatch:

jobs:
  build:
    name: Unsigned simulator build
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
